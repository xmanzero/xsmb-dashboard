name: Update data

on:
  workflow_dispatch:
  schedule:
    - cron: 35 11 * * * # 6:35 PM in Vietnam
    # Retry 30 minutes later: if the first run saw a draw still in progress, fetch.py stopped
    # without saving that day, and this run picks it up. It does nothing when the data is complete.
    - cron: 5 12 * * * # 7:05 PM in Vietnam
  push:
    branches: [main]
    # Redeploy the dashboard when its code changes.
    paths:
      - 'frontend/**'
      - '.github/workflows/update-data.yml'

permissions:
  contents: read

# Never run two updates at once: both would try to commit the same data.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    # A push only changes the dashboard code, so there is nothing to fetch.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout repo content
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev --no-install-project

      - name: Fetch data
        run: uv run src/fetch.py

      - name: Analyze data
        run: uv run src/analyze.py

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add .
          git commit -m "Updated $(date +'%Y-%m-%d')"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy-dashboard:
    needs: update-data
    # Deploy after new data was committed, on a manual run, or after a push of dashboard code
    # (update-data is skipped then). Scheduled runs without new data do not redeploy.
    if: >-
      !cancelled() && (
        needs.update-data.result == 'skipped' ||
        (needs.update-data.result == 'success' &&
          (needs.update-data.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repo content
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The branch head, which includes the data commit pushed by update-data
          # (the default would be the commit that triggered this run).
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # Also copies ../data into the build (prebuild runs scripts/copy-data.mjs).
      - name: Build
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
